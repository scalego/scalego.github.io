name: Decode Scale Go assets once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and commit preview and test audio
        shell: bash
        run: |
          set -euo pipefail
          cd ingles/daily-word
          cat encoded-og/og-*.txt | base64 -d > og-image.png
          file og-image.png
          mkdir -p audio
          python3 -c 'import base64,pathlib; [(pathlib.Path("audio",n).write_bytes(base64.b64decode(b,validate=True))) for n,b in (x.split(chr(9),1) for x in pathlib.Path("pack-test.txt").read_text().splitlines())]'
          file audio/*.ogg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-image.png audio/*.ogg
          git commit -m 'Add Scale Go preview and first audio pack' || exit 0
          git push
