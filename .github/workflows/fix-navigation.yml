name: Fix Scale Go navigation
on:
  push:
    paths:
      - .github/workflows/fix-navigation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link the header logo and tool return buttons to the home page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          logo_pages = ['index.html', 'en/index.html', 'ingles/index.html', 'ingles/en/index.html', '404/en/index.html', 'ingles/comparativos-superlativos/index.html', 'ingles/comparativos-superlativos/en/index.html']
          for name in logo_pages:
              path = Path(name)
              source = path.read_text()
              a = source.index('<header')
              b = source.index('</header>', a) + len('</header>')
              header = source[a:b]
              start = header.index('<svg width="34" height="34"')
              end = header.index('<div class="wm">Scale <span>Go</span></div>') + len('<div class="wm">Scale <span>Go</span></div>')
              logo = header[start:end]
              header = header[:start] + '<a class="brand-home" href="/" aria-label="Scale Go, inicio">' + logo + '</a>' + header[end:]
              source = source[:a] + header + source[b:]
              css = 'header .wm span{color:var(--accent)}'
              assert source.count(css) == 1, name
              source = source.replace(css, css + '\nheader .brand-home{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none}\nheader .brand-home:hover .wm{text-decoration:underline}\nheader .brand-home:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}', 1)
              if name == 'ingles/comparativos-superlativos/index.html':
                  source = source.replace('href="/ingles/">← INGLÉS', 'href="/">← SCALE GO', 1)
              elif name == 'ingles/comparativos-superlativos/en/index.html':
                  source = source.replace('href="/ingles/en/">← ENGLISH', 'href="/">← SCALE GO', 1)
              path.write_text(source)
          daily = Path('ingles/daily-word/index.html')
          source = daily.read_text()
          assert source.count('href="/ingles/">← Inglés') == 1
          daily.write_text(source.replace('href="/ingles/">← Inglés', 'href="/">← Scale Go', 1))
          Path('.github/workflows/fix-navigation.yml').unlink()
          PY
      - name: Publish and remove the temporary workflow
        run: |
          git config user.name 'Instinct Agent'
          git config user.email 'agent@instinct.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make header logos and tool return links go home'
          git push
