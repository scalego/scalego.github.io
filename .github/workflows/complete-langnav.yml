name: Complete 100-language navigation
on:
  push:
    paths: ['.github/workflows/complete-langnav.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update every language page
        shell: python
        run: |
          from pathlib import Path
          import re
          base=Path('ingles/verbos-irregulares')
          raw=':Español,en:English,fr:Français,de:Deutsch,pt:Português,it:Italiano,tr:Türkçe,nl:Nederlands,pl:Polski,sv:Svenska,da:Dansk,no:Norsk,fi:Suomi,ro:Română,hu:Magyar,cs:Čeština,uk:Українська,el:Ελληνικά,hr:Hrvatski,id:Bahasa Indonesia,hi:हिन्दी,ru:Русский,ja:日本語,ca:Català,gl:Galego,eu:Euskara,va:Valencià,ast:Asturianu,an:Aragonés,zh:中文,ko:한국어,ar:العربية,bn:বাংলা,vi:Tiếng Việt,th:ไทย,tl:Tagalog,ms:Bahasa Melayu,fa:فارسی,ur:اردو,sw:Kiswahili,he:עברית,ta:தமிழ்,te:తెలుగు,mr:मराठी,gu:ગુજરાતી,kn:ಕನ್ನಡ,pa:ਪੰਜਾਬੀ,ml:മലയാളം,my:မြန်မာ,am:አማርኛ,ha:Hausa,yo:Yorùbá,ig:Igbo,zu:Zulu,sr:Српски,bg:Български,sq:Shqip,hy:Հայերեն,be:Беларуская,sk:Slovenčina,lt:Lietuvių,bs:Bosanski,sl:Slovenščina,jv:Basa Jawa,bho:भोजपुरी,ps:پښتو,su:Basa Sunda,or:ଓଡ଼ିଆ,om:Afaan Oromoo,uz:Oʻzbek,mai:मैथिली,az:Azərbaycan,ne:नेपाली,sd:سنڌي,lo:ລາວ,ku:Kurdî,mg:Malagasy,ff:Fulfulde,so:Soomaali,ceb:Cebuano,ln:Lingála,xh:isiXhosa,km:ភាសាខ្មែរ,si:සිංහල,af:Afrikaans,rw:Kinyarwanda,as:অসমীয়া,bm:Bamanankan,st:Sesotho,ny:Chichewa,kk:Қазақша,ht:Kreyòl Ayisyen,lg:Luganda,wo:Wolof,eo:Esperanto,et:Eesti,lv:Latviešu,mk:Македонски,ga:Gaeilge,is:Íslenska'
          items=[x.split(':',1) for x in raw.split(',')]
          assert len(items)==100
          actual={p.name for p in base.iterdir() if p.is_dir() and (p/'index.html').exists()}
          assert actual=={c for c,_ in items if c}
          pages=[base/'index.html']+sorted(base.glob('*/index.html'))
          for p in pages:
            s=p.read_text(); m=re.search(r'<p class="langnav">(.*?)</p>',s,re.S); assert m
            prefix=m.group(1).split(':',1)[0]; cur='' if p==base/'index.html' else p.parent.name
            out=[]
            for code,label in items:
              if code==cur: out.append(f'<strong>{label}</strong>')
              else: out.append(f'<a href="/ingles/verbos-irregulares/{code+"/" if code else ""}">{label}</a>')
            rep=f'<p class="langnav">{prefix}: '+ ' · '.join(out) +'</p>'
            p.write_text(s[:m.start()]+rep+s[m.end():])
          for p in pages:
            b=re.search(r'<p class="langnav">(.*?)</p>',p.read_text(),re.S).group(1)
            assert len(re.findall(r'<(?:a|strong)\b',b))==100
            assert b.count('<strong>')==1
          Path('.github/workflows/complete-langnav.yml').unlink()
      - name: Commit batch
        run: |
          git config user.name 'RaulBaeza15'
          git config user.email '177480579+RaulBaeza15@users.noreply.github.com'
          git add ingles/verbos-irregulares .github/workflows/complete-langnav.yml
          git commit -m 'Complete language navigation across all 100 pages'
          git push
